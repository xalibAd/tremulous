name: CodeQL

# Static analysis of the C code and of the workflows themselves. Findings
# appear under Security > Code scanning.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: .github/codeql/codeql-config.yml
        queries: security-extended
    - name: Build
      if: matrix.build-mode == 'manual'
      run: |
        sudo apt-get update
        sudo apt-get install libsdl2-dev ninja-build
        # The QVMs are the same sources built with a different compiler
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GAME_QVMS=OFF
        cmake --build build
    - name: Analyze
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: /language:${{ matrix.language }}
