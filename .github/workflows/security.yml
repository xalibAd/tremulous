name: Security

# Checks that do not need a build: leaked secrets, known vulnerabilities in
# dependencies, outdated bundled libraries, and static analysis with tools
# other than CodeQL.

on:
  push:
    branches: [main, 'claude/**'] # TEMPORARY: claude/** is for testing this workflow
  pull_request:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_ENABLE_COMMENTS: false

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high

  bundled-libraries:
    name: Bundled Library Versions
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Compare with upstream releases
      run: misc/check-lib-versions.sh

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install
      run: |
        sudo apt-get update
        sudo apt-get install cppcheck
    - name: Analyze
      run: |
        cppcheck --version
        # Report only; the findings are published as an artifact and in the
        # job summary rather than failing the build
        cppcheck -j "$(nproc)" --enable=warning,portability --inconclusive --max-configs=2 \
          --suppress=missingIncludeSystem --inline-suppr --quiet \
          -i code/thirdparty -i code/tools \
          --template='{file}:{line}: {severity}: {message} [{id}]' \
          code 2> cppcheck-report.txt || true
        COUNT=$(wc -l < cppcheck-report.txt)
        {
          echo "### Cppcheck: ${COUNT} findings"
          echo
          echo '```'
          grep -o '\[[A-Za-z_]*\]$' cppcheck-report.txt | sort | uniq -c | sort -rn
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cppcheck-report
        path: cppcheck-report.txt

  lint:
    name: Lint Workflows and Scripts
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: actionlint
      run: |
        bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
        ./actionlint -color
      env:
        # Hold the scripts in the workflows to the same bar as the ones in
        # misc/: report real problems, not quoting style
        SHELLCHECK_OPTS: --severity=warning
    - name: shellcheck
      run: shellcheck --severity=error --exclude=SC2148 misc/*.sh misc/macos/*.sh
