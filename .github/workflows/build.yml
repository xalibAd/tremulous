name: Build
on: [push, pull_request]

# Jobs only get to read the repository unless they ask for more
permissions:
  contents: read

# A newer push to a branch or pull request supersedes the runs before it,
# except on main where every commit is built and released
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  versions:
    name: Extract Versions
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.extract-version.outputs.base }}
      sdl: ${{ steps.extract-library-versions.outputs.sdl }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: CMake Configure
      id: extract-version
      run: |
        cmake -S . -B build -G Ninja -DBUILD_CLIENT=NO
        VERSION=$(cat build/version.txt)
        echo "VERSION: ${VERSION}"
        echo "base=${VERSION}" >> $GITHUB_OUTPUT
    - name: Library Versions
      id: extract-library-versions
      run: |
        . misc/lib-versions.sh
        echo "sdl=${SDL_VERSION}" >> $GITHUB_OUTPUT

  # The original game data is not in the repository. Fetch it once, so that
  # the release builds can bundle it and are complete games.
  game-data:
    name: Game Data
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: game-data
        key: game-data-${{ hashFiles('misc/fetch-game-data.sh') }}
    - name: Fetch
      if: steps.cache.outputs.cache-hit != 'true'
      run: misc/fetch-game-data.sh game-data
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: game-data
        path: game-data/*.pk3
        compression-level: 0
        retention-days: 1

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    needs: [versions, game-data]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libsdl2-dev xvfb libgl1-mesa-dri
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: game-data
        path: game-data
    - name: Compile
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGAME_DATA_DIR=game-data
        cmake --build build
    - name: Smoke Test
      run: |
        misc/ci-smoke-test.sh build/Release opengl2 atcs
        misc/ci-smoke-test.sh build/Release opengl1 atcs
    - name: Package
      run: |
        cpack --config build/CPackConfig.cmake -B build/installer --verbose
        mv build/installer/*.deb build/Release
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ github.event.repository.name }}-linux-${{ needs.versions.outputs.base }}
        path: |
          build/Release/**/*
  windows-msvc:
    name: Windows MSVC
    runs-on: windows-2022
    needs: [versions, game-data]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: game-data
        path: game-data
    - name: Compile
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -DGAME_DATA_DIR=game-data
        cmake --build build --config Release
        cpack --config build/CPackConfig.cmake -B build/installer --verbose
        Move-Item -Path "build/installer/*.exe" -Destination "build/Release"
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ github.event.repository.name }}-windows-msvc-${{ needs.versions.outputs.base }}
        path: |
          build/Release/**/*.dll
          build/Release/**/*.exe
          build/Release/**/*.qvm
          build/Release/**/*.pk3
  windows-mingw:
    name: Windows MinGW
    runs-on: windows-2022
    needs: versions
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Compile
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build
        cpack --config build/CPackConfig.cmake -B build/installer --verbose
        Move-Item -Path "build/installer/*.exe" -Destination "build/Release"
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ github.event.repository.name }}-windows-mingw-${{ needs.versions.outputs.base }}
        path: |
          build/Release/**/*.dll
          build/Release/**/*.exe
          build/Release/**/*.qvm
          build/Release/**/*.pk3
  macos:
    name: macOS
    runs-on: macos-15
    needs: [versions, game-data]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: game-data
        path: game-data
    - name: Import Code Signing Certificate
      if: github.ref_name == 'main'
      run: |
        misc/macos/ci-macos-import-codesign-cert.sh
        echo "APPLE_CERTIFICATE_ID=${{ secrets.APPLE_CERTIFICATE_ID }}" >> $GITHUB_ENV
      env:
        APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    - name: Compile
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGAME_DATA_DIR=game-data
        cmake --build build
        # DMG creation on macOS occasionally fails, so try multiple times
        # https://gitlab.kitware.com/cmake/cmake/-/issues/25671
        success=0
        max_tries=10
        for _ in $(seq $max_tries); do
         cpack --config build/CPackConfig.cmake -B build/installer --verbose && success=1
         if test $success = 1; then
          break
         fi
         echo "Package creation failed. Sleep 1 second and try again."
         sleep 1
        done
        if test $success = 0; then
         echo "Package creation failed after $max_tries attempts."
         exit 1
        fi
        mv build/installer/*.dmg build/Release
    - name: Notarize
      if: github.ref_name == 'main'
      run: |
        misc/macos/ci-macos-notarize.sh build/Release/*.dmg
      env:
        APPLE_NOTARIZATION_USERNAME: ${{ secrets.APPLE_NOTARIZATION_USERNAME }}
        APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ github.event.repository.name }}-macOS-${{ needs.versions.outputs.base }}
        path: |
          build/Release/**/*
  emscripten:
    name: Emscripten
    runs-on: ubuntu-22.04
    needs: versions
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install emsdk
      uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      with:
        version: 3.1.58
    - name: Compile
      run: |
        emcmake cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ github.event.repository.name }}-emscripten-${{ needs.versions.outputs.base }}
        path: |
          build/Release/**/*
  linux-external-libraries:
    name: Linux (USE_INTERNAL_LIBS OFF)
    runs-on: ubuntu-22.04
    needs: versions
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libsdl2-dev zlib1g-dev libjpeg-dev libopenal-dev \
          libogg-dev libvorbis-dev libopus-dev libopusfile-dev libcurl4-openssl-dev
    - name: Compile
      run: |
        cmake -S . -B build -G Ninja -DUSE_INTERNAL_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
        cmake --build build
  linux-sdl3:
    name: Linux (SDL3)
    runs-on: ubuntu-22.04
    needs: versions
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Dependencies
      run: |
        sudo apt-get update
        # There is no SDL3 package here, so build it; libsdl2-dev brings in
        # the X11 and audio headers that it needs
        sudo apt-get install libsdl2-dev xvfb libgl1-mesa-dri
    - name: Build SDL3
      run: |
        . misc/lib-versions.sh
        curl -sL "https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-${SDL3_VERSION}.tar.gz" | tar -xz
        cmake -S SDL3-${SDL3_VERSION} -B sdl3-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=${PWD}/sdl3 -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
        cmake --build sdl3-build
        cmake --install sdl3-build
    - name: Compile
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${PWD}/sdl3
        grep -q "sdl3/sdl_glimp.c" build/build.ninja
        cmake --build build
    - name: Smoke Test
      run: |
        misc/ci-smoke-test.sh build/Release opengl2
  linux-32bit:
    name: Linux 32-bit
    runs-on: ubuntu-22.04
    needs: versions
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install gcc-multilib libsdl2-dev:i386
    - name: Compile
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32 -msse -msse2"
        cmake --build build
  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    needs: versions
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Compile
      uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
      with:
        prepare: |
          pkg install -y cmake ninja devel/sdl20
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    needs: versions
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Compile
      uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
      with:
        prepare: |
          pkg_add cmake ninja sdl2
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

  # A release is published for every push to main, and for a tag that matches
  # the version in the build system
  check-is-release:
    if: github.event_name == 'push'
    name: Check For Release
    runs-on: ubuntu-latest
    needs: versions
    outputs:
      is-release: ${{ steps.is-release-test.outputs.result }}
      tag: ${{ steps.is-release-test.outputs.tag }}
      title: ${{ steps.is-release-test.outputs.title }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check Release
      id: is-release-test
      env:
        VERSION: ${{ needs.versions.outputs.base }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [[ "${REF_TYPE}" = 'tag' && "${REF_NAME}" = "${VERSION}" ]]
        then
          echo "Tag '${REF_NAME}' is a release"
          echo "result=true" >> $GITHUB_OUTPUT
          echo "tag=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "title=Release ${VERSION}" >> $GITHUB_OUTPUT
        elif [[ "${REF_TYPE}" = 'branch' && "${REF_NAME}" = 'main' ]]
        then
          echo "A push to main is released as '${VERSION}'"
          echo "result=true" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "title=Build ${VERSION}" >> $GITHUB_OUTPUT
        else
          echo "Not a release"
          echo "result=false" >> $GITHUB_OUTPUT
        fi

  # Put together what a release consists of. This runs for every push so that
  # it is tested before it matters; the result is an artifact of the run.
  package:
    name: Package
    runs-on: ubuntu-latest
    needs:
      - versions
      - windows-msvc
      - macos
      - linux
      - emscripten
    env:
      NAME: ${{ github.event.repository.name }}
      VERSION: ${{ needs.versions.outputs.base }}
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
    - name: Prepare Release Artifacts
      run: |
        mkdir release-artifacts

        # Installers
        mv ${NAME}-linux-${VERSION}/*.deb release-artifacts/${NAME}-${VERSION}-linux-x86_64.deb
        mv ${NAME}-windows-msvc-${VERSION}/Tremulous-*.exe release-artifacts/${NAME}-${VERSION}-windows-x86_64-installer.exe
        mv ${NAME}-macOS-${VERSION}/*.dmg release-artifacts/${NAME}-${VERSION}-macos-universal.dmg

        # Archives that run from wherever they are unpacked. Artifacts do
        # not keep file permissions, so restore the executable bits.
        chmod +x ${NAME}-linux-${VERSION}/tremulous ${NAME}-linux-${VERSION}/tremded
        tar -czf release-artifacts/${NAME}-${VERSION}-linux-x86_64.tar.gz ${NAME}-linux-${VERSION}
        zip -r9 release-artifacts/${NAME}-${VERSION}-windows-x86_64.zip ${NAME}-windows-msvc-${VERSION}
        zip -r9 release-artifacts/${NAME}-${VERSION}-emscripten.zip ${NAME}-emscripten-${VERSION}

        (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
        ls -l release-artifacts

        echo "### Release artifacts" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        cat release-artifacts/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "--- Linux archive"; tar -tzf release-artifacts/*-linux-x86_64.tar.gz
        echo "--- Windows archive"; unzip -l release-artifacts/*-windows-x86_64.zip
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-artifacts
        path: release-artifacts/*
        compression-level: 0

  release:
    name: Release
    if: github.event_name == 'push' && needs.check-is-release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - check-is-release
      - package
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-artifacts
        path: release-artifacts
    - name: Publish Release Artifacts
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        tag_name: ${{ needs.check-is-release.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: ${{ needs.check-is-release.outputs.title }}
        generate_release_notes: true
        files: release-artifacts/*
        body: |
          Tremulous for Windows, Linux and macOS, built from this commit.

          These are complete: they contain the game and the original game
          data (Tremulous 1.1.0 and the GPP1 update, under the Creative
          Commons Attribution-ShareAlike 2.5 license), so nothing else has
          to be downloaded. The web build is the exception and comes
          without the data.

          | File | Platform |
          | --- | --- |
          | `*-windows-x86_64-installer.exe` | Windows installer |
          | `*-windows-x86_64.zip` | Windows, unpack and run |
          | `*-macos-universal.dmg` | macOS, Intel and Apple Silicon |
          | `*-linux-x86_64.deb` | Debian and Ubuntu package |
          | `*-linux-x86_64.tar.gz` | Linux, unpack and run |
          | `*-emscripten.zip` | Web build |

          `SHA256SUMS.txt` has the checksums of all of the above.
